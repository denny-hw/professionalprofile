<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Intervensi - Denny Wicaksono</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Gaya dasar */
        body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100%; }
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            pointer-events: none;
        }
        .header h1 { margin: 0; font-size: 1.5rem; color: #1a7a5a; }
        .header p { margin: 5px 0 0; font-size: 0.9rem; color: #555; }
        .back-link {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: #1a7a5a;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        .back-link:hover { background: #146a4a; }
        
        /* Custom popup style */
        .custom-popup .leaflet-popup-content {
            font-size: 14px;
            min-width: 200px;
        }
        .custom-popup h3 {
            margin: 0 0 5px;
            color: #1a7a5a;
            border-bottom: 2px solid #1a7a5a;
            padding-bottom: 5px;
        }
        .custom-popup ul {
            margin: 5px 0 0;
            padding-left: 20px;
        }
        .custom-popup li {
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <!-- Header di atas peta -->
    <div class="header">
        <h1>📍 Wilayah Intervensi & Program</h1>
        <p>Klik marker untuk melihat detail kegiatan</p>
    </div>
    
    <!-- Container Peta -->
    <div id="map"></div>
    
    <!-- Tombol Kembali -->
    <a href="index.html" class="back-link">← Kembali ke CV</a>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Inisialisasi Peta - fokus ke Indonesia
            const map = L.map('map').setView([-2.5, 118.0], 5); // Zoom level 5 = seluruh Indonesia
            
            // 2. Tambahkan Layer Peta (OpenStreetMap)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            // 3. Buat Custom Icon (lingkaran hijau dengan angka)
            function createCustomIcon(color, label) {
                return L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="
                        background-color: ${color};
                        width: 30px;
                        height: 30px;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border: 3px solid white;
                        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
                        color: white;
                        font-weight: bold;
                        font-size: 12px;
                    ">${label}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
            }
            
            // 4. Data Lokasi Kerja (dari CV Anda)
            const locations = [
                {
                    name: "Sumatera Barat",
                    lat: -0.95, 
                    lng: 100.35,
                    icon: createCustomIcon('#2c6e9c', '1'),
                    activities: [
                        "UNICEF Indonesia - Health Officer (Immunization)",
                        "Advokasi Surat Edaran Gubernur untuk Imunisasi MR",
                        "Supervisi 5 Kabupaten Prioritas",
                        "Video Imbauan Publik dari Gubernur"
                    ]
                },
                {
                    name: "Aceh",
                    lat: 5.16, 
                    lng: 97.14,
                    icon: createCustomIcon('#e67e22', '2'),
                    activities: [
                        "UNICEF Indonesia - Dukungan Polio Outbreak Response (ORI)",
                        "Engagement dengan Kepala Dinkes Aceh Utara",
                        "Surat Edaran Bupati & Instruksi Kepala Dinkes",
                        "Monitoring Harian ORI Aceh"
                    ]
                },
                {
                    name: "Jawa Tengah",
                    lat: -7.50, 
                    lng: 110.00,
                    icon: createCustomIcon('#27ae60', '3'),
                    activities: [
                        "CHAI Indonesia - Program Officer New Vaccines",
                        "Integrated MNCH-Immunization Cohort Tool (Klaten, Magelang, Wonosobo)",
                        "Supervisi 7 Kabupaten",
                        "On-the-Job Training Puskesmas"
                    ]
                },
                {
                    name: "Jakarta",
                    lat: -6.20, 
                    lng: 106.82,
                    icon: createCustomIcon('#8e44ad', '4'),
                    activities: [
                        "CHAI Indonesia - National Level Coordination",
                        "PIC Revisi Pedoman Teknis HPV Nasional",
                        "Koordinasi dengan Kemenkes RI (Dit Imunisasi & Farmalkes)",
                        "Koordinas Lintas Kementerian"
                    ]
                },
                {
                    name: "Sawahlunto, Sumatera Barat",
                    lat: -0.67, 
                    lng: 100.78,
                    icon: createCustomIcon('#d35400', '5'),
                    activities: [
                        "Kemenkes RI - Health Promotion Officer",
                        "Program Nusantara Sehat",
                        "Edukasi Gizi dan Stunting",
                        "Skrining NCD di Posyandu Lansia"
                    ]
                },
                {
                    name: "Padang, Sumatera Barat",
                    lat: -0.95, 
                    lng: 100.36,
                    icon: createCustomIcon('#2980b9', '6'),
                    activities: [
                        "Health Administration Officer - Andalas Health Center",
                        "Analisis Indikator Program Kesehatan",
                        "Penyusunan Laporan Tahunan Puskesmas"
                    ]
                }
            ];
            
            // 5. Tambahkan Marker ke Peta
            locations.forEach((loc, index) => {
                const marker = L.marker([loc.lat, loc.lng], {
                    icon: loc.icon
                }).addTo(map);
                
                // Buat Popup dengan daftar kegiatan
                let activitiesList = loc.activities.map(a => `<li>${a}</li>`).join('');
                const popupContent = `
                    <div class="custom-popup">
                        <h3>${loc.name}</h3>
                        <ul>${activitiesList}</ul>
                    </div>
                `;
                
                marker.bindPopup(popupContent, { className: 'custom-popup' });
            });
            
            // 6. Tambahkan Layer Control (opsional)
            L.control.scale({ position: 'bottomleft' }).addTo(map);
            
        });
    </script>
</body>
</html>
